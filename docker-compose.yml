services:
  watcharr:
    # Build our own fork's Dockerfile instead of pulling sbondCo's prebuilt image,
    # so custom-dev features are actually included.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watcharr
    ports:
      - 3080:3080
    volumes:
      # Contains all of watcharr data (database & cache)
      - ./data:/data
    restart: unless-stopped
